<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenF1 Dashboard</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app">
    <header class="header-container">
      <div class="logo-title">
        <span class="f1-icon">🏎️</span>
        <h1>OpenF1 Dashboard</h1>
      </div>
      
      <div class="session-selector-group">
        <label for="year-select">Temporada:</label>
        <select id="year-select" class="custom-select"></select>

        <label for="session-select">Sesión:</label>
        <select id="session-select" class="custom-select">
          <option value="">Cargando sesiones...</option>
        </select>
      </div>
    </header>

    <nav class="navigation-bar">
      <button class="nav-btn active" data-view="grid">🏁 Parrilla General</button>
      <button class="nav-btn" data-view="single">👤 Ficha Piloto</button>
      <button class="nav-btn" data-view="winner">🏆 Ganador</button>
      <button class="nav-btn" data-view="fastest">⚡ Mejor Vuelta</button>
    </nav>

    <section class="controls-container">
      <div id="search-container" class="control-group">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar por piloto, equipo o acrónimo..." 
          class="custom-input"
        />
      </div>

      <div id="driver-select-container" class="control-group hidden">
        <label for="driver-select">Seleccionar Piloto:</label>
        <select id="driver-select" class="custom-select">
          <option value="">-- Elige un piloto --</option>
        </select>
      </div>
    </section>

    <main id="content-area" class="main-content"></main>
  </div>

</body>
</html>
