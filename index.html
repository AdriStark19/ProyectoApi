<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calendario, sesiones y clasificaciones de Fórmula 1 con datos de OpenF1." />
    <title>Pit Wall · F1 con OpenF1</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e10600'/><path d='M7 22h18M7 16h12M7 10h18' stroke='white' stroke-width='3'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Titillium+Web:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <div>
          <h1 class="brand__title">PIT WALL</h1>
          <p class="brand__tagline">Datos reales de F1 · vía OpenF1</p>
        </div>
      </div>

      <div class="controls">
        <label class="field">
          <span class="field__label">Temporada</span>
          <select id="year-select" class="field__input"></select>
        </label>
        <label class="field field--grow">
          <span class="field__label">Buscar GP</span>
          <input id="meeting-search" class="field__input" type="search" placeholder="Mónaco, Spa, Japan…" autocomplete="off" />
        </label>
        <button id="cache-button" class="button button--ghost" type="button">Vaciar caché</button>
      </div>
    </header>

    <main class="layout">
      <section id="calendar-panel" class="panel panel--calendar" aria-label="Calendario de la temporada" aria-live="polite"></section>
      <section id="detail-panel" class="panel panel--detail" aria-label="Detalle del Gran Premio" aria-live="polite"></section>
    </main>

    <footer class="footer">
      Proyecto no oficial, sin relación con Formula 1. Datos de <a href="https://openf1.org" target="_blank" rel="noopener">OpenF1</a>.
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
